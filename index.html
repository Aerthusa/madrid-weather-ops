<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Madrid Weather Ops Command Center</title>
<style>
body{margin:0;background:#0a0f1a;color:#eaf0ff;font-family:system-ui;padding:10px}
.card{background:#131c2e;border-radius:16px;padding:12px;margin:10px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:#1c2942;padding:10px;border-radius:10px}
.big{font-size:1.4rem;font-weight:bold}
iframe{width:100%;height:420px;border:0;border-radius:12px}
table{width:100%}
td{padding:4px}
</style>
</head>
<body>
<h1>🛰️ Madrid Weather Ops Command Center</h1>

<div class="card"><h2>Conditions</h2><div id="current">Chargement...</div></div>

<div class="card"><h2>Évaluation du risque</h2><div id="risk"></div></div>

<div class="card"><h2>Prévisions 7 jours</h2><div id="forecast"></div></div>

<div class="card"><h2>Centre environnemental</h2>
<table>
<tr><td>🏜️ Poussières Sahara</td><td id="sahara">Estimation automatique</td></tr>
<tr><td>🌬️ Vent</td><td id="windsrc">Analyse en cours</td></tr>
<tr><td>🔥 Chaleur</td><td id="heat">Analyse en cours</td></tr>
</table>
</div>

<div class="card">
<h2>Carte Windy</h2>
<iframe src="https://embed.windy.com/embed2.html?lat=40.4168&lon=-3.7038&zoom=6"></iframe>
</div>

<script>
async function run(){
const url='https://api.open-meteo.com/v1/forecast?latitude=40.4168&longitude=-3.7038&current=temperature_2m,relative_humidity_2m,surface_pressure,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,sunrise,sunset';
const r=await fetch(url);
const d=await r.json();

document.getElementById('current').innerHTML=`
<div class='grid'>
<div class='kpi'>🌡️<div class='big'>${d.current.temperature_2m}°C</div></div>
<div class='kpi'>💨<div class='big'>${d.current.wind_speed_10m} km/h</div></div>
<div class='kpi'>💧<div class='big'>${d.current.relative_humidity_2m}%</div></div>
<div class='kpi'>📈<div class='big'>${Math.round(d.current.surface_pressure)} hPa</div></div>
</div>`;

let t=d.current.temperature_2m;
let risk='🟢 Conditions favorables';
if(t>34) risk='🟠 Forte chaleur';
if(t>38) risk='🔴 Canicule';
document.getElementById('risk').innerHTML=risk;

let out='<table>';
for(let i=0;i<d.daily.time.length;i++){
out+=`<tr><td>${d.daily.time[i]}</td><td>${d.daily.temperature_2m_min[i]}°</td><td>${d.daily.temperature_2m_max[i]}°</td></tr>`;
}
out+='</table>';
document.getElementById('forecast').innerHTML=out;

document.getElementById('heat').innerText=t>34?'🟠 Élevée':'🟢 Modérée';
document.getElementById('windsrc').innerText='🌊 Atlantique (estimation)';
document.getElementById('sahara').innerText=t>36?'🟠 À surveiller':'🟢 Faible';
}
run();
</script>
</body>
</html>
