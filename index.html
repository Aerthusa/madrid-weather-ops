<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Madrid Weather Ops V5</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{margin:0;padding:12px;font-family:system-ui;background:linear-gradient(#07111f,#122544);color:white}
.card{background:rgba(255,255,255,.08);backdrop-filter:blur(8px);border-radius:20px;padding:16px;margin:12px 0}
.hero{font-size:3rem;font-weight:bold}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:rgba(255,255,255,.06);padding:14px;border-radius:16px}
iframe{width:100%;height:520px;border:0;border-radius:16px}
canvas{background:rgba(255,255,255,.04);border-radius:16px;padding:8px}
.small{opacity:.8}
</style>
</head>
<body>

<div class="card">
<div class="small">Madrid • Espagne</div>
<div id="temp" class="hero">--°C</div>
<div id="summary">Chargement...</div>
</div>

<div class="card">
<div class="grid">
<div class="kpi">🌡️ Température<br><b id="t1">--</b></div>
<div class="kpi">💨 Vent<br><b id="w1">--</b></div>
<div class="kpi">💧 Humidité<br><b id="h1">--</b></div>
<div class="kpi">☀️ Pression<br><b id="p1">--</b></div>
</div>
</div>

<div class="card">
<h2>📈 Évolution température 7 jours</h2>
<canvas id="tempChart"></canvas>
</div>

<div class="card">
<h2>🌬️ Masses d'air</h2>
<div>Origine estimée : Atlantique</div>
<div>Poussières Sahara : 🟢 Faible</div>
<div>Humidité : Modérée</div>
</div>

<div class="card">
<h2>🗺️ Carte météo</h2>
<iframe src="https://embed.windy.com/embed2.html?lat=40.4168&lon=-3.7038&zoom=6"></iframe>
</div>

<script>
async function load(){
const url='https://api.open-meteo.com/v1/forecast?latitude=40.4168&longitude=-3.7038&current=temperature_2m,relative_humidity_2m,surface_pressure,wind_speed_10m&daily=temperature_2m_max';
const r=await fetch(url);
const d=await r.json();

document.getElementById('temp').innerText=d.current.temperature_2m+'°C';
document.getElementById('summary').innerText='Conditions actuelles';
document.getElementById('t1').innerText=d.current.temperature_2m+'°C';
document.getElementById('w1').innerText=d.current.wind_speed_10m+' km/h';
document.getElementById('h1').innerText=d.current.relative_humidity_2m+'%';
document.getElementById('p1').innerText=Math.round(d.current.surface_pressure)+' hPa';

new Chart(document.getElementById('tempChart'),{
type:'line',
data:{
labels:['J1','J2','J3','J4','J5','J6','J7'],
datasets:[{data:d.daily.temperature_2m_max,borderWidth:3}]
},
options:{responsive:true}
});
}
load();
</script>
</body>
</html>
